{% extends 'base.html' %}

{% block title %}Создать график{% endblock %}

{% block content %}
<h2>Параметры графика (y = x²)</h2>
<form method="get" action="{% url 'plot' %}">
    <label>Цвет линии:</label>
    <select name="color">
        <option value="blue">Синий</option>
        <option value="red">Красный</option>
        <option value="green">Зелёный</option>
        <option value="black">Чёрный</option>
    </select><br><br>

    <label>Толщина линии:</label>
    <input type="number" name="thickness" value="2" min="1" max="10"><br><br>

    <label>Масштаб:</label>
    <input type="number" name="scale" value="10" min="1" max="100"><br><br>

    <input type="submit" value="Построить график">
</form>
{% endblock %}
